<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <div class="container">
            <div class="cpu">

            </div>
            <div class="user">

                
            </div>
        </div>
        <div class="bottom">

            <div class="dialog">
                <div class="catInHat">
                    
                    <img src="images/cat.png" id="cat">
                    <img src="images/hat.png" id="hat">
                </div>
                <div class="dialog-box">
                    <p id="dialog-text"></p>
                    

                </div>
            </div>

            <div class="right">

                <div class="press">
                    <button class="pushable">
                        <span class="front">
                            START
                        </span>
                    </button>
                    
                </div>
                
                
                <div class="start">
                    
                    <div class="rounds">
                        <svg width="40" height="260" xmlns="http://www.w3.org/2000/svg">
                            <circle r="7" cx="10" cy="60" fill="white"  stroke="black" stroke-width="1"  />
                            <circle r="7" cx="10" cy="90" fill="white"  stroke="black" stroke-width="1"   />
                            <circle r="7" cx="10" cy="120" fill="white"   stroke="black" stroke-width="1"  />
                            <circle r="7" cx="10" cy="150" fill="white"   stroke="black" stroke-width="1"  />
                            <circle r="7" cx="10" cy="180" fill="white"  stroke="black" stroke-width="1"   />
                        </svg>
                    </div>
                    
                    <div class="rps-buttons">
                        <button><img src="images/rock.png" class="buttons"> </button>
                        <button><img src="images/paper.png" class="buttons"> </button>
                        <button><img src="images/scissors.png" class="buttons"></button>
                        
                    </div>
                </div>
            </div>
                
                
            </div>
        </div>
        
        
        
        





    <script src="script.js"></script>
    
</body>
</html>
