<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
       <div id="battlefield">
           <div class="hand enemy"></div>
                 <div class="hand player"></div>
        </div>
        <div class="bottom">
                
            <div class="dialog">
                <div class="catInHat">
                    
                    <img src="images/cat.png" id="cat">
                    <img src="images/hat.png" id="hat">
                </div>
                <div class="dialog-box">
                    <p id="dialog-text"></p>
                    

                </div>
            </div>

            <div class="right">

                <div class="press">
                    <button class="pushable">
                        <span class="front">
                            START
                        </span>
                    </button>
                    
                </div>
                
                
                <div class="start">
                    
                    <div class="rounds">
                      <ul>
                          <li><img src="images/brick1.png" id="brick"> </li>
                          <li><img src="images/brick1.png" id="brick"> </li>
                          <li><img src="images/brick1.png" id="brick"> </li>
                          <li><img src="images/brick1.png" id="brick"> </li>
                          <li><img src="images/brick1.png" id="brick"> </li>
                          
                          
                    </ul>
                    </div>
                    
                    <div class="rps-buttons">
                        <button  class="buttons" onclick="startBattle('rock')"><img src="images/rock.png" > </button>
                        <button  class="buttons" onclick="startBattle('paper')" ><img src="images/paper.png" > </button>
                        <button  class="buttons" onclick="startBattle('scissors')"><img src="images/scissors.png" ></button>
                        
                    </div>
                </div>
            </div>
                
                
            </div>
        </div>
        
        
        
        





    <script src="script.js"></script>
    
</body>
</html>
